name = "krvcf-app-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# API subdomain — Cloudflare creates DNS/certificate on deploy
routes = [{ pattern = "app-api.krvcf.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://app.krvcf.com,http://localhost:8080,http://127.0.0.1:8080"
SITE_URL = "https://app.krvcf.com"
# Default (overridable in Admin Console > Settings). true = publish without review
AUTO_APPROVE = "false"

# database_id / KV id are filled in automatically by GitHub Actions (scripts/provision.mjs) before deploy.
# Local dev (wrangler dev) uses local SQLite/KV with the values below.
[[d1_databases]]
binding = "DB"
database_name = "krvcf-apps"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "HTML"
id = "00000000000000000000000000000000"

# Daily log cleanup at 03:17 KST
[triggers]
crons = ["17 18 * * *"]

[observability]
enabled = true

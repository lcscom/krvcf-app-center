name: Deploy API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # Create D1 / KV if missing and inject IDs into wrangler.toml
      - name: Provision D1 & KV
        run: node scripts/provision.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply krvcf-apps --remote

      - name: Deploy worker
        run: npx wrangler deploy --var VERSION:${GITHUB_SHA}

      # Sync GitHub Secrets → Worker secrets (only those with values)
      - name: Sync worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GH_TOKEN_VALUE: ${{ secrets.PATCH_GITHUB_TOKEN }}
          GH_REPO_VALUE: ${{ github.repository }}
          GH_BRANCH_VALUE: ${{ github.ref_name }}
        run: |
          node -e '
            const e = process.env, o = {};
            for (const k of ["ADMIN_PASSWORD","SESSION_SECRET","GOOGLE_CLIENT_ID","RESEND_API_KEY","MAIL_FROM"]) if (e[k]) o[k] = e[k];
            if (e.GH_TOKEN_VALUE) { o.GH_TOKEN = e.GH_TOKEN_VALUE; o.GH_REPO = e.GH_REPO_VALUE; o.GH_BRANCH = e.GH_BRANCH_VALUE; }
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(o));
            console.log("syncing:", Object.keys(o).join(", ") || "(none)");
          '
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json

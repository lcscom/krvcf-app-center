<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="App Center">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KRVCF App Center">
  <meta property="og:title" content="KRVCF App Center">
  <meta property="og:description" content="VCF 커뮤니티 미니 앱 · HTML 시뮬레이터 공유 플랫폼 / Share and run community mini apps">
  <meta property="og:image" content="https://app.krvcf.com/icons/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>KRVCF App Center</title>
  <meta name="description" content="Share and instantly run mini apps and HTML simulators built by the VCF community. · VCF 커뮤니티 미니 앱·HTML 시뮬레이터 공유 플랫폼">
  <meta name="theme-color" content="#0e2a38">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%2349afd9'/%3E%3Crect x='18' y='2' width='12' height='12' rx='2' fill='%23ffffff'/%3E%3Crect x='2' y='18' width='12' height='12' rx='2' fill='%23ffffff'/%3E%3Crect x='18' y='18' width='12' height='12' rx='2' fill='%2349afd9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@cds/city@1.1.0/css/bundles/default.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="app.css">
  <script>try{var t=localStorage.getItem('krvcf.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hdr">
    <button class="hdr-btn hamb" id="navToggle" aria-label="메뉴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#/">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="#49afd9"/><rect x="18" y="2" width="12" height="12" rx="2" fill="#fff"/><rect x="2" y="18" width="12" height="12" rx="2" fill="#fff"/><rect x="18" y="18" width="12" height="12" rx="2" fill="#49afd9"/></svg>
      <span class="brand-name">KRVCF</span><span class="brand-sub">App Center</span>
    </a>
    <div class="gsearch">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" type="search" placeholder="앱 이름, 설명, 작성자, #태그 검색" autocomplete="off">
      <kbd class="kbd gs-kbd" id="gqKbd" title="Quick jump">Ctrl K</kbd>
    </div>
    <div class="hdr-right">
      <a class="btn btn-primary btn-sm hdr-submit" href="#/submit">+ 앱 등록</a>
      <button class="hdr-btn" id="themeBtn" title="라이트/다크 테마"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      <button class="hdr-btn bell" id="bellBtn" hidden title="Notifications" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bellN" hidden></span></button>
      <a class="hdr-btn hdr-user" id="userBtn" href="#/admin" title="관리 콘솔"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="userLabel">로그인</span></a>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="내비게이터"></nav>
    <div class="nav-scrim" id="navScrim"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <section class="tasks" id="tasks">
    <div class="tasks-hd">
      <button class="tasks-toggle" id="tasksToggle"><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg> 최근 작업 <span class="tasks-count" id="tasksCount">0</span></button>
      <span class="tasks-last" id="tasksLast"></span>
      <span class="tasks-api" id="apiState"><i></i>API 확인 중</span>
    </div>
    <div class="tasks-bd">
      <table class="grid compact">
        <thead><tr><th>작업 이름</th><th>대상</th><th>상태</th><th>시작 시간</th><th>완료 시간</th></tr></thead>
        <tbody id="tasksBody"><tr><td colspan="5" class="empty">아직 작업이 없습니다.</td></tr></tbody>
      </table>
    </div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
